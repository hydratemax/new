<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KoIKMa — Laporan Perniagaan 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0a0f1e;
  --navy2:#0e1628;
  --navy3:#141f36;
  --red:#cc1f2d;
  --red2:#e8283a;
  --blue:#1a3c8f;
  --blue2:#2550c0;
  --gold:#d4a017;
  --gold2:#f0c030;
  --white:#ffffff;
  --off:#e8ecf4;
  --muted:#6b7fa3;
  --border:rgba(255,255,255,0.07);
  --border2:rgba(255,255,255,0.13);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;scroll-snap-type:y mandatory;}
body{font-family:'Outfit',sans-serif;background:var(--navy);color:var(--white);overflow-x:hidden;}

/* ── NAV ── */
nav{
  position:fixed;top:0;left:0;right:0;z-index:999;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 40px;height:64px;
  background:rgba(10,15,30,0.92);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border2);
}
.nav-logo{
  font-family:'Playfair Display',serif;font-size:18px;font-weight:700;
  background:linear-gradient(90deg,#fff,#d4a017);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.nav-links{display:flex;gap:6px;}
.nav-link{
  padding:6px 14px;border-radius:6px;font-size:11px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  cursor:pointer;transition:all .2s;border:1px solid transparent;text-decoration:none;
}
.nav-link:hover,.nav-link.active{color:var(--white);border-color:var(--border2);background:rgba(255,255,255,.05);}

/* ── SECTIONS ── */
section{
  min-height:100vh;scroll-snap-align:start;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:80px 40px 60px;position:relative;overflow:hidden;
}

/* ── HERO ── */
#hero{
  background:#04080f;
  text-align:center;
  overflow:hidden;
  position:relative;
}

/* Animated mesh gradient background */
.hero-mesh{
  position:absolute;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 60% 55% at 20% 20%, rgba(26,60,143,0.55) 0%, transparent 60%),
    radial-gradient(ellipse 50% 45% at 80% 15%, rgba(204,31,45,0.35) 0%, transparent 55%),
    radial-gradient(ellipse 70% 60% at 50% 80%, rgba(10,6,30,0.9) 0%, transparent 70%),
    radial-gradient(ellipse 40% 35% at 75% 65%, rgba(212,160,23,0.2) 0%, transparent 50%);
  animation:meshShift 12s ease-in-out infinite alternate;
}
@keyframes meshShift{
  0%{transform:scale(1) rotate(0deg);filter:hue-rotate(0deg);}
  100%{transform:scale(1.08) rotate(3deg);filter:hue-rotate(12deg);}
}

/* Aurora sweeping beams */
.aurora{
  position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;
}
.aurora-beam{
  position:absolute;border-radius:50%;mix-blend-mode:screen;
  animation:auroraDrift ease-in-out infinite alternate;
  filter:blur(80px);
}
.ab1{width:700px;height:300px;background:linear-gradient(90deg,rgba(204,31,45,0.4),transparent);top:10%;left:-200px;animation-duration:7s;animation-delay:0s;}
.ab2{width:600px;height:250px;background:linear-gradient(90deg,transparent,rgba(26,60,143,0.5),transparent);top:30%;right:-100px;animation-duration:9s;animation-delay:-3s;}
.ab3{width:500px;height:200px;background:linear-gradient(90deg,rgba(212,160,23,0.25),transparent);bottom:20%;left:20%;animation-duration:11s;animation-delay:-5s;}
@keyframes auroraDrift{
  0%{transform:translateX(0) scaleY(1);opacity:0.6;}
  100%{transform:translateX(120px) scaleY(1.4);opacity:1;}
}

/* Grid lines overlay */
.hero-grid{
  position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size:60px 60px;
  mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 40%,transparent 100%);
}

/* Floating orbs */
.hero-orbs{position:absolute;inset:0;z-index:0;pointer-events:none;}
.orb{
  position:absolute;border-radius:50%;
  animation:orbFloat ease-in-out infinite alternate;
  filter:blur(1px);
}
.orb1{width:6px;height:6px;background:#cc1f2d;top:15%;left:12%;box-shadow:0 0 20px 4px rgba(204,31,45,0.8);animation-duration:4s;}
.orb2{width:4px;height:4px;background:#d4a017;top:25%;right:18%;box-shadow:0 0 16px 3px rgba(212,160,23,0.8);animation-duration:5s;animation-delay:-1s;}
.orb3{width:5px;height:5px;background:#7eb5ff;bottom:30%;left:20%;box-shadow:0 0 18px 3px rgba(126,181,255,0.7);animation-duration:6s;animation-delay:-2s;}
.orb4{width:3px;height:3px;background:#fff;top:60%;right:25%;box-shadow:0 0 12px 3px rgba(255,255,255,0.6);animation-duration:3.5s;animation-delay:-.5s;}
.orb5{width:5px;height:5px;background:#cc1f2d;bottom:20%;right:15%;box-shadow:0 0 20px 4px rgba(204,31,45,0.7);animation-duration:4.5s;animation-delay:-1.5s;}
.orb6{width:4px;height:4px;background:#2dd4a0;top:40%;left:8%;box-shadow:0 0 16px 3px rgba(45,212,160,0.7);animation-duration:5.5s;animation-delay:-2.5s;}
@keyframes orbFloat{
  0%{transform:translateY(0) scale(1);opacity:0.7;}
  100%{transform:translateY(-30px) scale(1.3);opacity:1;}
}

/* Scan line sweep */
.hero-scanline{
  position:absolute;left:0;right:0;height:2px;z-index:1;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(204,31,45,0.6),rgba(212,160,23,0.4),transparent);
  animation:scanSweep 4s linear infinite;
  filter:blur(1px);
}
@keyframes scanSweep{
  0%{top:-2px;opacity:0;}
  5%{opacity:1;}
  95%{opacity:0.6;}
  100%{top:100%;opacity:0;}
}

.hero-content{
  position:relative;z-index:2;
  max-width:900px;width:100%;
  display:flex;flex-direction:column;align-items:center;
}

/* LOGO AREA */
.hero-logo-cluster{
  display:flex;flex-direction:column;align-items:center;
  margin-bottom:36px;
}
.hero-logo-ring{
  position:relative;
  width:160px;height:160px;
  display:flex;align-items:center;justify-content:center;
  animation:logoAppear 1.4s cubic-bezier(.34,1.3,.64,1) .1s both;
}
@keyframes logoAppear{
  0%{opacity:0;transform:scale(0.2) rotate(-20deg);filter:blur(20px);}
  60%{filter:blur(0);}
  70%{transform:scale(1.07) rotate(3deg);}
  100%{opacity:1;transform:scale(1) rotate(0deg);filter:blur(0);}
}
/* Spinning ring */
.logo-ring{
  position:absolute;inset:0;border-radius:50%;
  border:1.5px solid transparent;
  background:linear-gradient(#04080f,#04080f) padding-box,
             linear-gradient(var(--angle,0deg),#cc1f2d,#1a3c8f,#d4a017,#cc1f2d) border-box;
  animation:spinRing 4s linear infinite;
}
@keyframes spinRing{to{--angle:360deg;}}
.logo-ring-outer{
  position:absolute;inset:-10px;border-radius:50%;
  border:1px solid transparent;
  background:linear-gradient(#04080f,#04080f) padding-box,
             linear-gradient(var(--angle2,180deg),rgba(204,31,45,0.4),rgba(26,60,143,0.4),rgba(212,160,23,0.3)) border-box;
  animation:spinRingRev 6s linear infinite;
}
@keyframes spinRingRev{to{--angle2:-180deg;}}
.hero-logo-img{
  width:110px;height:auto;
  position:relative;z-index:2;
  filter:drop-shadow(0 0 30px rgba(204,31,45,0.6)) drop-shadow(0 0 60px rgba(26,60,143,0.5));
  animation:logoGlowPulse 3s ease-in-out infinite alternate;
}
@keyframes logoGlowPulse{
  0%{filter:drop-shadow(0 0 20px rgba(204,31,45,0.5)) drop-shadow(0 0 40px rgba(26,60,143,0.4));}
  100%{filter:drop-shadow(0 0 40px rgba(204,31,45,0.9)) drop-shadow(0 0 80px rgba(26,60,143,0.7)) drop-shadow(0 0 120px rgba(212,160,23,0.3));}
}
/* Pulse rings emanating */
.logo-pulse{
  position:absolute;inset:0;border-radius:50%;
  border:1px solid rgba(204,31,45,0.5);
  animation:pulsateOut 2.5s ease-out infinite;
}
.logo-pulse:nth-child(2){animation-delay:.8s;border-color:rgba(26,60,143,0.4);}
.logo-pulse:nth-child(3){animation-delay:1.6s;border-color:rgba(212,160,23,0.3);}
@keyframes pulsateOut{
  0%{transform:scale(1);opacity:1;}
  100%{transform:scale(2.5);opacity:0;}
}

/* Org name under logo */
.hero-org{
  font-size:10px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;
  color:rgba(255,255,255,0.35);margin-top:18px;
  animation:fadeUp .6s 1s ease both;
}

/* ── DIVIDER ── */
.hero-divider{
  display:flex;align-items:center;gap:16px;margin-bottom:28px;
  animation:fadeUp .6s .8s ease both;
}
.hdiv-line{height:1px;width:80px;background:linear-gradient(90deg,transparent,rgba(212,160,23,0.7));}
.hdiv-line.r{background:linear-gradient(90deg,rgba(212,160,23,0.7),transparent);}
.hdiv-dot{width:5px;height:5px;border-radius:50%;background:var(--gold2);box-shadow:0 0 10px rgba(212,160,23,0.8);}
.hdiv-text{font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold2);font-weight:700;}

/* ── MAIN TITLE ── */
.hero-title{
  font-family:'Playfair Display',serif;
  font-size:clamp(32px,5.5vw,62px);
  font-weight:900;line-height:1.08;
  letter-spacing:-.025em;
  margin-bottom:28px;
}
.title-line{
  display:block;overflow:hidden;
  animation:titleSlideUp .9s cubic-bezier(.22,1,.36,1) both;
}
.tl1{animation-delay:.9s;}
.tl2{animation-delay:1.05s;}
.tl3{animation-delay:1.2s;}
@keyframes titleSlideUp{
  from{opacity:0;transform:translateY(110%) skewY(5deg);}
  to{opacity:1;transform:translateY(0) skewY(0);}
}
.title-white{color:#fff;}
.title-accent{
  background:linear-gradient(120deg,#ff6b7a 0%,#cc1f2d 30%,#d4a017 70%,#f0c030 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  background-size:200%;
  animation:accentShimmer 4s linear infinite 1.5s;
}
@keyframes accentShimmer{
  0%{background-position:0%}100%{background-position:200%}
}

/* ── SUBTITLE ── */
.hero-sub{
  font-size:15px;font-weight:300;color:rgba(255,255,255,0.45);
  line-height:1.8;max-width:500px;margin:0 auto 44px;min-height:50px;
  animation:fadeUp .7s 1.5s ease both;
  letter-spacing:.01em;
}

/* ── BADGES ── */
.hero-badges{
  display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
  animation:fadeUp .7s 1.7s ease both;
}
.badge{
  padding:9px 22px;border-radius:8px;font-size:11px;font-weight:600;
  letter-spacing:.07em;text-transform:uppercase;
  backdrop-filter:blur(8px);
  transition:transform .2s,box-shadow .2s;cursor:default;
}
.badge:hover{transform:translateY(-3px);}
.badge-red{background:rgba(204,31,45,0.12);border:1px solid rgba(204,31,45,0.45);color:#ff8a93;}
.badge-blue{background:rgba(26,60,143,0.18);border:1px solid rgba(26,60,143,0.55);color:#7eb5ff;}
.badge-gold{background:rgba(212,160,23,0.1);border:1px solid rgba(212,160,23,0.4);color:var(--gold2);}

/* ── SCROLL ── */
.scroll-hint{
  position:absolute;bottom:32px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:10px;
  color:rgba(255,255,255,.2);font-size:9px;letter-spacing:.2em;text-transform:uppercase;
  animation:fadeUp .6s 2s ease both;
}
.scroll-track{width:1px;height:40px;background:rgba(255,255,255,.1);position:relative;overflow:hidden;}
.scroll-thumb{
  position:absolute;top:0;left:0;width:100%;height:40%;
  background:linear-gradient(to bottom,transparent,rgba(212,160,23,0.8));
  animation:scrollDrop 2s ease-in-out infinite;
}
@keyframes scrollDrop{
  0%{top:-40%;}100%{top:140%;}
}
.scroll-arrow{width:16px;height:16px;border-right:1.5px solid rgba(255,255,255,.2);border-bottom:1.5px solid rgba(255,255,255,.2);transform:rotate(45deg);animation:bounce 1.8s ease infinite;}
@keyframes bounce{0%,100%{transform:rotate(45deg) translateY(0);}50%{transform:rotate(45deg) translateY(5px);}}

@keyframes fadeUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}

<script>
// ── PARTICLES ──
(()=>{
  const c=document.getElementById('particles');
  const colors=['rgba(204,31,45,','rgba(26,60,143,','rgba(212,160,23,','rgba(255,255,255,'];
  for(let i=0;i<40;i++){
    const p=document.createElement('div');
    p.className='particle';
    const size=Math.random()*4+1;
    const col=colors[Math.floor(Math.random()*colors.length)];
    const dur=Math.random()*12+6;
    const delay=Math.random()*10;
    const left=Math.random()*100;
    p.style.cssText=`width:${size}px;height:${size}px;left:${left}%;background:${col}${Math.random()*.6+.2});animation-duration:${dur}s;animation-delay:-${delay}s;`;
    c.appendChild(p);
  }
})();

// ── TYPEWRITER ──
(()=>{
  const el=document.getElementById('heroSub');
  if(!el)return;
  const text='Ringkasan perkembangan perniagaan, inisiatif baharu, dan laporan kewangan KoIKMa untuk pembentangan 2026.';
  let i=0;
  el.innerHTML='<span class="cursor"></span>';
  const type=()=>{
    if(i<text.length){
      el.innerHTML=text.slice(0,++i)+'<span class="cursor">|</span>';
      setTimeout(type,Math.random()*30+20);
    }else{
      el.innerHTML=text;
    }
  };
  setTimeout(type,1600);
})();

// Progress bar
window.addEventListener('scroll',()=>{
  const h=document.documentElement.scrollHeight-window.innerHeight;
  const p=(window.scrollY/h)*100;
  document.getElementById('progressBar').style.width=p+'%';
});

// Reveal on scroll
const obs=new IntersectionObserver((entries)=>{
  entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add('visible');});
},{threshold:0.12,rootMargin:'0px 0px -60px 0px'});
document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));

// Active nav link
const sections=document.querySelectorAll('section');
const navLinks=document.querySelectorAll('.nav-link');
const navObs=new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      navLinks.forEach(l=>l.classList.remove('active'));
      const id=e.target.id;
      const active=document.querySelector(`.nav-link[href="#${id}"]`);
      if(active)active.classList.add('active');
    }
  });
},{threshold:0.4});
sections.forEach(s=>navObs.observe(s));
</script>
